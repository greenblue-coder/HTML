<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body{
            margin: 0;
            background-color: #e5e5e5;
            font-family: "Times New Roman", serif;
        }

        /* Navigation Bar */
        .navbar{
            background-color: #503232;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            border-radius: 0 0 10px 10px;
        }

        .logo{
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }

        .navbar a{
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .navbar a:hover{
            color: yellow;
        }

        /* Profile Box */
        .box{
            width: 420px;
            margin: 55px auto;
            background-color: #d3d3d3;
            border: 2px solid black;
            padding: 30px;
            text-align: center;
        }

        h1{
            color: darkblue;
            margin-bottom: 15px;
        }

        h2{
            color: darkgreen;
        }

        .photo{
            width: 120px;
            height: 120px;
            border: 3px solid black;
        }

        p{
            font-size: 18px;
        }

        ul{
            display: inline-block;
            text-align: left;
            font-size: 18px;
        }

        .website{
            color: blue;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <!-- Top Navigation -->
    <div class="navbar">
        <img src="logo.jpg" class="logo" alt="Logo">

        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#website">Website</a>
    </div>

    <!-- Profile Card -->
    <div class="box">

        <h1>Nishan Khanal</h1>

        <img src="photo.jpg" class="photo" alt="Student Photo">

        <h2 id="about">About Me</h2>

        <p>
            Hello! My name is Nishan Khanal. I am a computer science
            student and I am learning HTML, CSS and JavaScript.
        </p>

        <h2 id="skills">My Skills</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>C#</li>
        </ul>

        <h2 id="website">My Website</h2>

        <a href="https://example.com" class="website">
            Visit My Website
        </a>

    </div>

</body>
</html>
